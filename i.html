<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Invoice</title>
  <!--
    Public, read-only invoice view. Opened from a short link like i.html?t=<share_token>.
    No login: it calls the SECURITY DEFINER RPC public_invoice(token) with the anon key, which
    returns ONLY that one invoice (+ items, customer, whitelisted company settings). The page then
    reuses the app's own buildInvoice() to let the customer download the exact same PDF, and offers
    a Pay button (reuses pay.html). Nothing else in the database is exposed.
  -->
  <style>
    :root { --ink:#1d1b17; --text:#3d3a33; --muted:#8a8478; --gold:#b8913f; --goldD:#8c6a26;
      --cream:#fbf7ee; --line:#ece4d2; --green:#2e7a4e; --red:#a53a2e; --grand:#f3e8cc; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; }
    body { font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: var(--ink);
      background: radial-gradient(1000px 500px at 50% -8%, #fff, var(--cream)); padding: 16px; min-height: 100vh; }
    .wrap { max-width: 560px; margin: 0 auto; }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 16px;
      box-shadow: 0 10px 40px rgba(140,106,38,.10); overflow: hidden; }
    .head { padding: 20px 22px 16px; border-bottom: 1px solid var(--line);
      display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }
    .co { font-size: 17px; font-weight: 800; letter-spacing: .4px; color: var(--ink); }
    .co small { display: block; font-weight: 500; color: var(--muted); font-size: 11.5px; letter-spacing: 0; margin-top: 3px; line-height: 1.4; white-space: pre-line; }
    .seal { text-align: right; flex: none; }
    .seal .t { font-size: 11px; letter-spacing: 1.5px; color: var(--goldD); font-weight: 700; text-transform: uppercase; }
    .seal .n { font-size: 15px; font-weight: 700; margin-top: 2px; }
    .st { display: inline-block; margin-top: 6px; font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 20px; }
    .st.paid { color: var(--green); background: #e8f3ec; }
    .st.partial { color: var(--goldD); background: var(--grand); }
    .st.unpaid { color: var(--red); background: #f6e7e4; }
    .meta { display: flex; flex-wrap: wrap; gap: 4px 22px; padding: 14px 22px; font-size: 13px; color: var(--text); }
    .meta b { color: var(--ink); }
    .party { padding: 0 22px 8px; font-size: 13px; color: var(--text); }
    .party b { color: var(--ink); }
    table { width: 100%; border-collapse: collapse; }
    thead th { text-align: left; font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--goldD);
      padding: 10px 22px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--cream); }
    thead th.r { text-align: right; }
    tbody td { padding: 10px 22px; font-size: 13.5px; border-bottom: 1px solid #f3eee2; vertical-align: top; }
    tbody td.r { text-align: right; white-space: nowrap; }
    tbody td .d { color: var(--muted); font-size: 12px; }
    tbody tr.hdr td { background: #f9f4e8; color: var(--goldD); font-weight: 700; font-size: 11.5px; letter-spacing: .5px; text-transform: uppercase; }
    .totals { padding: 12px 22px 4px; }
    .trow { display: flex; justify-content: space-between; font-size: 13.5px; padding: 4px 0; color: var(--text); }
    .trow.grand { font-size: 17px; font-weight: 800; color: var(--ink); border-top: 1px solid var(--gold); margin-top: 6px; padding-top: 10px; }
    .trow .green { color: var(--green); } .trow .red { color: var(--red); font-weight: 700; }
    .actions { padding: 16px 22px 22px; display: grid; gap: 10px; }
    .btn { display: block; width: 100%; padding: 14px; border: 0; border-radius: 12px; font-size: 15px;
      font-weight: 700; text-decoration: none; text-align: center; cursor: pointer; }
    .btn.pay { color: #fff; background: var(--goldD); }
    .btn.dl { color: var(--goldD); background: #fff; border: 1.5px solid var(--gold); }
    .note { padding: 0 22px 18px; font-size: 12px; color: var(--muted); }
    .center { text-align: center; padding: 60px 20px; color: var(--muted); }
    .spin { width: 28px; height: 28px; border: 3px solid var(--line); border-top-color: var(--gold);
      border-radius: 50%; animation: s 0.8s linear infinite; margin: 0 auto 14px; }
    @keyframes s { to { transform: rotate(360deg); } }
    .err b { color: var(--red); display: block; margin-bottom: 6px; font-size: 15px; }
    .foot { text-align: center; font-size: 11px; color: var(--muted); margin-top: 14px; }
    /* Scan & Pay block (QR is the reliable hero; it works in every UPI app). */
    .pay-wrap { padding: 4px 22px 4px; }
    .pay-box { border: 1px solid var(--line); border-radius: 14px; padding: 18px; text-align: center; background: var(--cream); }
    .pay-box h3 { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--goldD); margin: 0 0 10px; }
    .qrwrap { display: inline-block; padding: 10px; background: #fff; border: 2px solid var(--gold); border-radius: 12px; }
    .qrwrap img { width: 210px; height: 210px; display: block; }
    .scan-cap { font-size: 14px; font-weight: 700; color: var(--goldD); margin: 12px 0 2px; }
    .scan-sub { font-size: 12px; color: var(--muted); }
    .upiid { font-size: 12.5px; color: var(--ink); margin-top: 8px; word-break: break-all; }
    .upiid b { color: var(--goldD); }
    .bank { font-size: 12px; color: var(--text); margin-top: 10px; line-height: 1.7; text-align: left; display: inline-block; }
    .bank span { color: var(--muted); }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="root"><div class="center"><div class="spin"></div>Loading invoice…</div></div>
    <div class="foot">Powered by Studio Manager</div>
  </div>

  <!-- Tiny QR generator (no network needed), MIT licensed. -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.118.0';
    import { SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY } from './js/config.js';

    const root = document.getElementById('root');
    const money = n => '₹' + (Number(n) || 0).toLocaleString('en-IN', { maximumFractionDigits: 2 });
    const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const fmtDate = d => { if (!d) return '—'; const x = new Date(d + 'T00:00:00'); return x.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }); };
    const token = new URLSearchParams(location.search).get('t');

    function showError(msg) {
      root.innerHTML = `<div class="card"><div class="center err"><b>Invoice not found</b>${esc(msg)}</div></div>`;
    }

    async function main() {
      if (!token) return showError('This link is missing its invoice code.');
      let data;
      try {
        const sb = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
        const { data: res, error } = await sb.rpc('public_invoice', { p_token: token });
        if (error) throw error;
        data = res;
      } catch (e) {
        return showError('Could not load this invoice. Please try again later.');
      }
      if (!data || !data.invoice) return showError('This invoice link is invalid or has been removed.');
      render(data);
    }

    function render(data) {
      const { invoice: inv, items, company, customer, project } = data;
      const st = company.settings || {};
      const gst = !!st.gst_enabled;
      const party = inv.party_name ? ` · ${esc(inv.party_name)}` : '';
      const statusCls = inv.status === 'paid' ? 'paid' : inv.status === 'partial' ? 'partial' : 'unpaid';

      const rows = (items || []).map(it => {
        if (it.detail === '__header__') return `<tr class="hdr"><td colspan="4">${esc(it.description)}</td></tr>`;
        const amt = Math.round((Number(it.qty) * Number(it.rate)) * 100) / 100;
        return `<tr>
          <td>${esc(it.description)}${it.detail ? `<div class="d">${esc(it.detail)}</div>` : ''}</td>
          <td class="r">${Number(it.qty)}</td>
          <td class="r">${money(it.rate)}</td>
          <td class="r">${money(amt)}</td></tr>`;
      }).join('');

      const taxLine = gst && Number(inv.tax_amount) > 0
        ? `<div class="trow"><span>GST (${Number(inv.tax_percent)}%)</span><span>${money(inv.tax_amount)}</span></div>` : '';
      const discLine = Number(inv.discount_amount) > 0
        ? `<div class="trow"><span>Discount</span><span>– ${money(inv.discount_amount)}</span></div>` : '';

      const hasBalance = Number(inv.balance) > 0;
      const qrImgUrl = st.pay_qr_url || '';                 // uploaded merchant QR (preferred)
      const canPay = hasBalance && (qrImgUrl || st.upi);
      const payUrl = hasBalance && st.upi ? payLink(inv, company) : null;
      const showPayBtn = payUrl && st.upi_button_enabled === true; // off by default (apps reject it)
      const genUpiStr = hasBalance && !qrImgUrl && st.upi ? upiDeepLink(inv, company) : null; // generated QR fallback
      const bankBits = [
        st.bank_name && ['Bank', st.bank_name], st.account_number && ['A/C No.', st.account_number],
        st.ifsc && ['IFSC', st.ifsc], st.account_holder && ['A/C Name', st.account_holder],
      ].filter(Boolean);
      const qrMarkup = qrImgUrl
        ? `<div class="qrwrap"><img src="${esc(qrImgUrl)}" alt="Scan to pay" style="width:210px;height:210px;object-fit:contain" /></div>`
        : `<div class="qrwrap"><img id="payqr" alt="Scan to pay with any UPI app" /></div>`;
      const payBlock = canPay ? `
        <div class="pay-wrap"><div class="pay-box">
          <h3>Scan &amp; Pay</h3>
          ${qrMarkup}
          <div class="scan-cap">Scan to pay ${money(inv.balance)}</div>
          <div class="scan-sub">Open GPay / PhonePe / Paytm / any UPI app and scan</div>
          ${st.upi ? `<div class="upiid">UPI ID: <b>${esc(st.upi)}</b></div>` : ''}
          ${bankBits.length ? `<div class="bank">${bankBits.map(([k, v]) => `<div><span>${k}:</span> ${esc(v)}</div>`).join('')}</div>` : ''}
        </div></div>` : '';

      const logoMarkup = company.logo_url
        ? `<img src="${esc(company.logo_url)}" alt="" style="width:40px;height:40px;border-radius:8px;object-fit:cover;flex:none" />` : '';
      root.innerHTML = `
        <div class="card">
          <div class="head">
            <div style="display:flex;gap:10px;align-items:flex-start;min-width:0">
              ${logoMarkup}
              <div class="co">${esc(company.name)}<small>${esc([st.address, st.mobile].filter(Boolean).join('\n'))}</small></div>
            </div>
            <div class="seal">
              <div class="t">${gst ? 'Tax Invoice' : 'Invoice'}</div>
              <div class="n">${esc(inv.number)}</div>
              <span class="st ${statusCls}">${inv.status === 'paid' ? 'Paid' : inv.status === 'partial' ? 'Part paid' : 'Unpaid'}</span>
            </div>
          </div>
          <div class="meta">
            <div>Date: <b>${fmtDate(inv.invoice_date)}</b></div>
            <div>Due: <b>${fmtDate(inv.due_date)}</b></div>
          </div>
          <div class="party">Billed to: <b>${esc(customer?.name || '—')}</b>${party}${project?.name ? ` · ${esc(project.name)}` : ''}</div>
          <table>
            <thead><tr><th>Service / Item</th><th class="r">Qty</th><th class="r">Rate</th><th class="r">Amount</th></tr></thead>
            <tbody>${rows || '<tr><td colspan="4" style="text-align:center;color:var(--muted)">No items</td></tr>'}</tbody>
          </table>
          <div class="totals">
            <div class="trow"><span>Subtotal</span><span>${money(inv.subtotal)}</span></div>
            ${discLine}${taxLine}
            <div class="trow grand"><span>Total</span><span>${money(inv.total)}</span></div>
            <div class="trow"><span>Received</span><span class="green">${money(inv.paid_amount)}</span></div>
            <div class="trow"><span>Balance due</span><span class="red">${money(inv.balance)}</span></div>
          </div>
          ${payBlock}
          ${inv.notes ? `<div class="note"><b>Notes:</b> ${esc(inv.notes)}</div>` : ''}
          <div class="actions">
            ${showPayBtn ? `<a class="btn pay" href="${esc(payUrl)}">Tap to pay ${money(inv.balance)}</a>` : ''}
            <button class="btn dl" id="dl">Download PDF</button>
          </div>
        </div>`;

      // If no merchant QR image was uploaded, generate a upi:// QR as a fallback.
      if (genUpiStr && window.qrcode) {
        try { const qr = qrcode(0, 'M'); qr.addData(genUpiStr); qr.make(); const img = document.getElementById('payqr'); if (img) img.src = qr.createDataURL(6, 8); }
        catch (e) { /* QR lib failed — UPI id + bank details still shown */ }
      }
      const dl = document.getElementById('dl');
      if (dl) dl.addEventListener('click', () => downloadPdf(data, dl));
    }

    // Standard upi://pay deep link for the QR (every UPI app scans this).
    function upiDeepLink(inv, company) {
      const st = company.settings || {};
      const note = [inv.number, inv.party_name].filter(Boolean).join(' · ');
      const p = new URLSearchParams({ pa: st.upi, pn: company.name || '', am: (Number(inv.balance)).toFixed(2), cu: 'INR', tn: note });
      return 'upi://pay?' + p.toString().replace(/\+/g, '%20');
    }

    // Build the SAME pay.html link the app/PDF use.
    function payLink(inv, company) {
      const st = company.settings || {};
      const note = [inv.number, inv.party_name].filter(Boolean).join(' · ');
      const p = new URLSearchParams({ pa: st.upi, pn: company.name || '', am: (Number(inv.balance)).toFixed(2), cu: 'INR', tn: note });
      return 'pay.html?' + p.toString().replace(/\+/g, '%20');
    }

    // Reuse the app's real PDF builder so the downloaded PDF is identical to what the studio sends.
    async function downloadPdf(data, btn) {
      const old = btn.textContent; btn.textContent = 'Preparing…'; btn.disabled = true;
      try {
        const [{ state, setCompany }, docs] = await Promise.all([
          import('./js/store.js'), import('./js/pdf/docs.js'),
        ]);
        const { invoice: inv, items, installments, company, customer, project } = data;
        setCompany({ id: 'public', name: company.name, settings: company.settings || {} });
        state.logoUrl = company.logo_url || null; // public logo URL from the RPC (shows in the PDF)
        const pdf = await docs.buildInvoice({ inv, items, installments: installments || [], customer, project });
        await pdf.download();
      } catch (e) {
        alert('Sorry, could not generate the PDF. Please try again.');
      } finally {
        btn.textContent = old; btn.disabled = false;
      }
    }

    main();
  </script>
</body>
</html>
